<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi profe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c4472b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi profe">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>window.PWA=true;window.APP_VERSION="20261009-0843";window.MP_SERVER="https://mi-profe.miprofe-app.workers.dev";</script>
<style>:root{
  --bg:#faf6f1; --surface:#ffffff; --surface2:#f3ece3; --ink:#2a211c; --muted:#76685e;
  --line:#e6dbcf; --accent:#c4472b; --accent-ink:#ffffff; --accent-soft:#f8e3dc; --accent-strong:#a3361c;
  --gold:#e0a526; --gold-soft:#fbf0d6; --ok:#2f8a57; --ok-soft:#e1f2e8; --bad:#c23a3a; --bad-soft:#f9e1e1;
  --info:#2d6aa3; --info-soft:#e2edf8; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 16px rgba(60,40,20,.06);
  --radius:14px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b1714; --surface:#25201c; --surface2:#2e2823; --ink:#f2ebe4; --muted:#b0a397; --line:#3d352e;
    --accent:#e2694c; --accent-ink:#1b1714; --accent-soft:#3f2620; --accent-strong:#f08d71; --gold:#e8b549; --gold-soft:#3a3020;
    --ok:#5cc28a; --ok-soft:#1f3a2a; --bad:#ec6b6b; --bad-soft:#432222; --info:#76aee6; --info-soft:#1e2e40;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1714; --surface:#25201c; --surface2:#2e2823; --ink:#f2ebe4; --muted:#b0a397; --line:#3d352e;
  --accent:#e2694c; --accent-ink:#1b1714; --accent-soft:#3f2620; --accent-strong:#f08d71; --gold:#e8b549; --gold-soft:#3a3020;
  --ok:#5cc28a; --ok-soft:#1f3a2a; --bad:#ec6b6b; --bad-soft:#432222; --info:#76aee6; --info-soft:#1e2e40;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app>div{min-width:0}
.ptop>*{min-width:0}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:14px 0 0 var(--gold)}

.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;color:var(--ink)}
@media (hover:hover){.nav button:hover{background:var(--surface2)}}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:12px;border-radius:99px;padding:1px 8px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px}
.main{padding:28px 36px 80px;max-width:1040px;width:100%;margin:0 auto}
.app.mini .main{max-width:1140px}
h1{font-family:var(--serif);font-size:30px;margin:0 0 6px;line-height:1.2}
h2{font-family:var(--serif);font-size:22px;margin:28px 0 10px}
h3{font-size:16px;margin:18px 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.stat{padding:16px}
.stat .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
@media (hover:hover){.btn:hover{background:var(--surface2)}}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:hover){.btn.primary:hover{filter:brightness(1.06)}}
.btn.ghost{background:none;border-color:transparent}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--gold-soft);color:#9a6b00} .pill.new{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
:root[data-theme="dark"] .pill.warn{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{color:var(--gold)}}
.unit{display:flex;gap:16px;align-items:center;padding:16px 18px;cursor:pointer;transition:transform .08s}
@media (hover:hover){.unit:hover{transform:translateY(-1px);border-color:var(--accent)}}
.unit .num{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;font-weight:700;font-family:var(--serif);font-size:20px;flex:none}
.unit.locked{opacity:.55;cursor:default}
@media (hover:hover){.unit.locked:hover{transform:none;border-color:var(--line)}}
.unit .t{font-weight:700;font-family:var(--serif);font-size:18px}
.unit .d{color:var(--muted);font-size:14px}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
@media (hover:hover){.lesson:hover{border-color:var(--accent)}}
.lesson .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:15px;flex:none}
.lesson.done .ic{background:var(--ok-soft);color:var(--ok)}
.lesson .lt{font-weight:600}
.lesson .ld{font-size:13px;color:var(--muted)}
/* player */
.player{max-width:720px;margin:0 auto}
.ptop{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.ptop .bar{flex:1;height:8px}
.step{animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kind{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.q{font-size:20px;font-weight:600;margin:0 0 16px;line-height:1.4}
.q .es{font-family:var(--serif)}
.opts{display:grid;gap:10px}
.opt{padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;font-size:17px}
@media (hover:hover){.opt:hover{border-color:var(--accent)}}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:18px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.gapi{width:auto;min-width:90px;display:inline-block;padding:4px 8px;font-size:18px;margin:0 3px;text-align:center}
.inp.right{border-color:var(--ok);background:var(--ok-soft)} .inp.wrong{border-color:var(--bad);background:var(--bad-soft)}
textarea.inp{min-height:120px;resize:vertical;font-size:16px}
.gapq{font-size:20px;line-height:2.2;font-family:var(--serif)}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.keys .kshift.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keys button{width:36px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:16px}
@media (hover:hover){.keys button:hover{border-color:var(--accent)}}
.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.warn{background:var(--gold-soft);border:1px solid var(--gold)}
.fb.ai{background:var(--info-soft);border:1px solid var(--info)}
.fb b.h{display:block;margin-bottom:4px}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center}
/* Hauptknopf über die ganze Breite, feste Höhe – nichts verrutscht beim Wechsel Prüfen → Weiter */
.actions>.btn{min-height:48px}
.actions>.btn.primary{flex:1}
.speak{border:0;background:var(--accent-soft);color:var(--accent-strong);border-radius:50%;width:30px;height:30px;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;flex:none;font-size:14px}
@media (hover:hover){.speak:hover{filter:brightness(.95)}}
.speak.big{width:64px;height:64px;font-size:26px}
.info{font-size:16px}
.info table{border-collapse:collapse;margin:10px 0;width:100%;font-size:15px}
.info th,.info td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left}
.info th{background:var(--surface2);font-weight:600}
.info .ex{background:var(--surface2);border-left:3px solid var(--gold);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.info .ojo{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin:10px 0}
.info .ojo::before{content:var(--ojo,"¡OJO! ");font-weight:700;color:var(--accent)}
.es-t{font-family:var(--serif)}
.vlist{display:grid;gap:6px}
.vrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;background:var(--surface2)}
.vrow .es{font-family:var(--serif);font-size:18px;font-weight:600;min-width:40%}
.vrow .de{color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:12px}
.tile{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--serif);font-size:18px;box-shadow:var(--shadow)}
@media (hover:hover){.tile:hover{border-color:var(--accent)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{font-size:16px;padding:10px 14px}
.match .opt.done{opacity:.35;pointer-events:none;border-color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;background:var(--surface2);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--accent-soft)}
.msg .who{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.msg .tr{font-size:13px;color:var(--muted);margin-top:4px}
.msg .es-t{font-size:17px}
.scene{font-size:14px;color:var(--muted);background:var(--surface2);padding:10px 14px;border-radius:10px;margin-bottom:14px}
.flash{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.flash .big{font-family:var(--serif);font-size:32px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.hide{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:99;font-size:14px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:1px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface2)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:14px}
.resumen h3{color:var(--accent)}
.diff del{color:var(--bad)} .diff ins{color:var(--ok);text-decoration:none;font-weight:700}
.mobile-nav{display:none}
@media (max-width:1023px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
  body.typing .mobile-nav{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mobile-nav button{border:0;background:none;padding:6px 0 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--muted);min-width:0}
  .mobile-nav .mi{font-size:20px;line-height:1.1}
  .mobile-nav .ml{font-size:10.5px;font-weight:600;white-space:nowrap}
  .mobile-nav button.active{background:var(--accent-soft);color:var(--accent)}
  .mobile-nav .mbadge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;border-radius:99px;padding:0 5px;line-height:15px}
  .keys button{width:auto;min-width:40px;height:40px;font-size:18px;padding:0 6px}
  .inp,.inp.gapi,select.inp{font-size:16px}
  .main{padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .g3,.g4{grid-template-columns:repeat(2,1fr)} .g2{grid-template-columns:1fr}
}
.reading{font-size:19px;line-height:1.75}
.reading p{margin:0 0 12px}
.gl{border-bottom:1.5px dotted var(--accent);cursor:pointer}
@media (hover:hover){.gl:hover{background:var(--accent-soft)}}
.glpop{position:fixed;z-index:50;background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:8px;font-size:14px;max-width:280px;box-shadow:var(--shadow)}
.shadowcard{text-align:center;padding:30px 20px}
.shadowcard .es{font-family:var(--serif);font-size:26px;line-height:1.4;margin:10px 0}
.shadowcard .es.blur{filter:blur(7px);user-select:none}
.phase{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.phase span{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--surface2);color:var(--muted)}
.phase span.on{background:var(--accent);color:var(--accent-ink)}
.overlay{position:fixed;inset:0;background:rgba(20,12,8,.45);display:grid;place-items:center;padding:16px;z-index:100}

/* Stufen & Bilder */
.lvhead{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.lvhead h2{margin:0}
.lvbadge{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:10px;padding:6px 10px;font-family:var(--serif);font-size:18px;flex:none}
.pic{font-size:22px;line-height:1;width:30px;text-align:center;flex:none}
.qpic{display:block;font-size:56px;line-height:1;margin:2px 0 6px}

/* Runden pro Lektion */
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rounds .rd{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
.rounds .rd.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
@media (hover:hover){.rounds .rd:hover{border-color:var(--accent)}}

/* einklappbare Seitenleiste */
.brand{justify-content:space-between}
.sidetog{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px;line-height:1;flex:none}
@media (hover:hover){.sidetog:hover{color:var(--accent);border-color:var(--accent)}}
.nav .ni{width:22px;text-align:center;flex:none}
.app{transition:grid-template-columns .15s}
.app.mini{grid-template-columns:72px 1fr}
.app.mini .side{padding:20px 8px;align-items:center}
.app.mini .brand{padding:4px 0 16px;justify-content:center}
.app.mini .brand .bt,.app.mini .nav .nl{display:none}
.app.mini .nav{width:100%}
.app.mini .nav button{justify-content:center;padding:10px 0;position:relative}
.app.mini .nav .badge{position:absolute;top:2px;right:4px;font-size:10px;padding:0 5px}
.app.mini .foot{padding:8px 0;text-align:center}
/* Woche */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 8px;text-align:center}
.wb{height:56px;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.wb i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0;min-height:0}
.wd.now .small.muted{color:var(--accent);font-weight:700}

/* Startseite */
.hero{border-color:var(--accent);cursor:pointer;padding:22px 24px}
.hero h2{font-size:24px}
.hic{font-size:34px;line-height:1;flex:none;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;font-weight:600}
@media (hover:hover){.chip:hover{border-color:var(--accent);color:var(--accent)}}

/* Kachel-Menüs */
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.mtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:112px;box-shadow:var(--shadow)}
@media (hover:hover){.mtile:hover{border-color:var(--accent)}}
.mtile .mi2{font-size:28px;line-height:1;margin-bottom:6px}
.mtile .mt{font-weight:700;font-size:16px}
.mtile .md{font-size:12.5px;color:var(--muted);line-height:1.3}
.mtile .mb{position:absolute;top:10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px}
/* Stufen-Reiter */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-top:14px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button b{font-size:15px;color:var(--ink)} .seg button span{font-size:11px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)} .seg button.on b{color:var(--accent)}
/* Startseite: Tagesfortschritt */
.today{margin:4px 0 14px}
.chip.done{opacity:.6}
@media (max-width:700px){
  .mtiles{grid-template-columns:repeat(2,1fr);gap:10px}
  .mtile{min-height:104px;padding:14px}
  .unit .d{display:none}
  .unit{padding:12px 14px;gap:12px}
  .unit .num{width:36px;height:36px;font-size:17px}
  .unit .t{font-size:16px}
}

.seg.two{grid-template-columns:repeat(2,1fr);margin-top:10px}
.lrow{padding:12px 14px}
@media (max-width:700px){.lrow .ld{display:none}.lrow .rounds{margin-top:6px}}
@media (max-width:700px){.chips .chip{padding:6px 12px}.wb{height:30px}.week{margin:4px 0 0}.hero{padding:16px 18px}.hero h2{font-size:21px}.hic{font-size:28px}.today{margin:0 0 12px}}

<script>/* Neustart (Sprachwechsel, Update …): erst Startbildschirm mit Drehsymbol zeigen, dann neu laden – sonst wirkt die App kurz eingefroren */
/* Kurse für die Auswahl; Kurse im Aufbau (PACKS beta) nur nach einmal ?beta=1 (ausschalten: ?beta=0) und immer der gerade gewählte */
function learnPacks(){let beta=false;try{const q=new URLSearchParams(location.search).get('beta');if(q!=null)localStorage.setItem('mi-profe-beta',q==='1'?'1':'');beta=localStorage.getItem('mi-profe-beta')==='1';}catch(e){}
  const cur=window.LANG&&LANG.code;return window.PACKS?PACKS.learn.filter(L=>!L.beta||beta||L.code===cur):Object.values(LANGS).filter(L=>L.course&&L.course.units.length).map(L=>({code:L.code,name:L.name,flag:L.flag}));}
function bootScreen(){let b=document.getElementById('boot');if(!b){/* Flagge der Sprache, die gleich geladen wird */let f='🌍';try{const c=JSON.parse(localStorage.getItem('mi-profe-shared')||'{}').lang;const P=((window.PACKS&&PACKS.learn)||[]).find(x=>x.code===c)||LANGS[c];if(P)f=P.flag;}catch(e){}
  b=document.createElement('div');b.id='boot';b.innerHTML='<div class="bootlogo">'+f+'</div><div class="bootspin"></div>';document.body.appendChild(b);}return b;}
/* Startbildschirm ruhig ausblenden: mindestens 1 s ab dem Öffnen (länger, wenn die App länger braucht) und 0,3 s nach dem Aufbau, dann 0,4 s weiches Ausblenden */
let bootHiding=false,HOMEFIT=null,HOMESTATE=null; /* HOMESTATE: Kompakt-Stufe der Startseite (0–3), einmal pro Sitzung entschieden */function hideBoot(){const bt=document.getElementById('boot');if(!bt||bootHiding)return;bootHiding=true;
  setTimeout(()=>{if(HOMEFIT)HOMEFIT();bt.classList.add('out');setTimeout(()=>{bt.remove();bootHiding=false;},420);},Math.max(300,1000-(Date.now()-(window.__t0||Date.now()))));} /* eigene Stoppuhr (__t0 im Sicherheitsnetz) – performance.now() startet auf iOS zu früh */ 
function reloadApp(){bootScreen();setTimeout(()=>location.reload(),60);}
/* ===== Mi profe · Engine (sprachunabhängig – alles Sprachspezifische steht im Paket LANG, siehe lang.js) ===== */
(function(){
'use strict';
selectLang();
/* Oberflächensprache: T(deutscher Text) liefert die Übersetzung aus UI_TR[ui] oder den deutschen Text */
let UI='de';try{const sh=JSON.parse(localStorage.getItem('mi-profe-shared')||'null');const nav=(navigator.language||'de').toLowerCase();
  UI=sh&&sh.ui||(sh?'de':nav.startsWith('de')?'de':nav.startsWith('es')?'es':nav.startsWith('pt')?'pt':'en');}catch(e){}
if(UI!=='de'&&!(window.UI_TR&&UI_TR[UI]))UI='de';document.documentElement.lang=UI;
const TR=UI==='de'?null:UI_TR[UI];const T=s=>TR&&TR[s]!=null?TR[s]:s;
/* Lob in der Lernsprache (¡Muy bien!, ¡Hola! …): Texte enthalten die spanischen Wendungen; ein anderes Paket ersetzt sie über LANG.praise {'¡Muy bien!':'Sehr gut!', …} */
const TP=k=>{let r=T(k);const P=LANG.praise;if(P)for(const a in P)r=r.split(a).join(P[a]);return r;};
/* Hinweiskästen (.ojo) beginnen mit „¡OJO!“ – in anderen Lernsprachen aus LANG.praise (z. B. 'ACHTUNG!') */
if(LANG.praise&&LANG.praise['¡OJO!'])document.documentElement.style.setProperty('--ojo',JSON.stringify(LANG.praise['¡OJO!']+' '));
for(const L of LEVELS){L.title=T(L.title);L.sub=T(L.sub);}

/* ---------- Abschlusstest (statt ganzer Einheit) ---------- */

/* ---------- lesson player ---------- */
/* Häufige Wörter: beim ersten Mal Wortlisten + Übung, danach jedes Mal 14 neu gemischte Aufgaben aus allen 30 Wörtern */
function freqSteps(u,l){const W=l.steps.filter(s=>s.t==='vocab').flatMap(s=>s.items);const first=!S.lessons[u.id+'.'+l.id]?.done;
  const pick=shuffle(W.slice());const take=n=>pick.splice(0,n);const out=[];
  if(first)l.steps.forEach((s,i)=>{if(s.t==='vocab')out.push({s,ref:u.id+'|'+l.id+'|'+i});});
  const ex=[];for(const k of [0,1]){const ps=shuffle(W.slice()).slice(0,5);ex.push({s:{t:'match',q:T('Was bedeutet …?'),pairs:ps.map(w=>[w[0],w[1]])},ref:u.id+'|'+l.id+'|'+l.steps.findIndex(x=>x.t==='match')});}
  [['mcde',4],['mc',3],['tr',3],['listen',2]].forEach(([mode,n])=>take(n).forEach(w=>ex.push(vocabItem(u,w,mode))));
  return out.concat(shuffle(ex));}

  play(m,{title:''+UW+' '+u.n+' · '+l.title,steps,unit:u,pk:'lesson/'+uid+'/'+lid,onBack:()=>goBack('unit/'+uid),
    onDone:(res)=>{const k=uid+'.'+lid;if(l.ab){const prev=S.lessons[k];S.lessons[k]={done:true,best:Math.max(prev?.best||0,res.score),date:today()};if(l.freq)S.lessons[k].freqL=1;save();return{label:T('Zur ')+UW+' →',fn:()=>go('unit/'+uid)};}
      const was=rnd(k);setRound(k,1,res.score);
      if(was<2&&(res.score>=0.9||shortLesson(l))){setRound(k,shortLesson(l)?3:2,res.score);}
      const nx=nextLesson();const r=rnd(k);
      return r>=2?(nx?{label:T('Weiter: ')+nxTitle(nx)+' →',fn:()=>go(nxRoute(nx))}:{label:T('Zur ')+UW+' →',fn:()=>go('unit/'+uid)}):{label:T('Runde 2: Üben →'),fn:()=>go('round/'+uid+'/'+lid+'/2')};},
    extraEnd:(res)=>{const r=rnd(uid+'.'+lid);return l.ab?null:shortLesson(l)?h('div',{class:'fb ok'},T('Diese Lektion braucht keine Extra-Runden – erledigt ✓')):res.score>=0.9&&r===2&&S.lessons[uid+'.'+lid].d2===today()?h('div',{class:'fb ok'},T('Stark! Über 90 % – „Üben“ überspringst du. „Festigen“ wird morgen frei.')):null;}});}

/* ---------- Zwischenspeichern: angefangene Lektionen/Runden/Vokabelrunden merken sich automatisch, wo du warst ----------

/* Text zu einer Verständnisfrage finden (Fehlerheft, Gemischte Wiederholung): Lektion = letzter Lesetext davor, Geschichte, Lesetext */

    if(await askConfirm(T('Lektion abbrechen? Der Fortschritt dieser Lektion geht verloren.'),T('Abbrechen & zurück')))cfg.onBack();}},'✕'),h('div',{class:'bar'},h('i',{style:'width:0'})),undoB,h('span',{class:'muted small',id:'pcount'}));

      h('h1',{},pct>=90?TP('¡Excelente!'):pct>=70?TP('¡Muy bien!'):TP('¡Sigue así!')),
      gradeable?h('p',{class:'sub'},pct+T('% beim ersten Versuch richtig')):h('p',{class:'sub'},T('Lektion abgeschlossen')),

      h('div',{class:'endbtns'},after?h('button',{class:'btn primary',onclick:after.fn},after.label):null,
        (()=>{const np=dayPlan().find(x=>!x.done&&x.r!==curRoute());return np?h('button',{class:'btn'+(after?'':' primary'),onclick:()=>{NAVRESET=true;planGo(np);}},'📅 '+T('Nächste Aufgabe: ')+np.t+' →'):null;})(),

/* Zahlen & Uhrzeit: wie man es in der Lernsprache sagt, steht im Paket (LANG.numbers: word, time, date, price, unlock) */

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
/* freigeschaltet nach Kursfortschritt: Zahlen ab U1, große Zahlen ab U2 L3, Uhrzeit & Preise ab U4, Datum ab U6 */
/* gelernt = Lektion mindestens einmal gemacht (Runde 1) oder Abschlusstest der Unidad bestanden */
const learnedL=(uid,lid)=>rnd(uid+'.'+lid)>=1||!!S.checks[uid]?.pass;
/* Zahlen-Aufgaben nach gelernten Lektionen: U1 L2 Zahlen 0–10 · U2 L3 bis 20 & große Zahlen · U4 L3 Uhrzeit · U4 L4 Preise · U6 L2 Datum. all = auch Neues */
function numKinds(all){const K=[];if(!NUMS)return K;const UL=NUMS.unlock||{};const L=k=>all||!UL[k]||learnedL(UL[k][0],UL[k][1]);
  if(L('small'))K.push('numw','numl');if(L('big'))K.push('bigw','bigl');if(L('time'))K.push('time','timel');if(L('price'))K.push('price');if(L('date'))K.push('date');return K;}
let NUM_ALL=false;
function numVal(kind){const t20=(NUMS.unlock||{}).to20;if(kind==='numw'||kind==='numl')return rint(0,NUM_ALL||!t20||learnedL(t20[0],t20[1])?20:10)+'';if(kind==='bigw'||kind==='bigl')return(Math.random()<.5?rint(21,99):Math.random()<.6?rint(100,999):rint(1000,2100))+'';
  if(kind==='time'||kind==='timel')return rint(0,23)+':'+String(rint(0,11)*5).padStart(2,'0');if(kind==='date')return rint(1,28)+'.'+rint(1,12);
  return rint(1,40)+','+String(rint(0,19)*5).padStart(2,'0');}
const near=(n,max)=>{const c=new Set([n+10,n-10,n+1,n-1,+String(n).split('').reverse().join(''),n%10===6?n+1:n%10===7?n-1:n+20]);if(Math.floor(n/10)===6)c.add(n+10);if(Math.floor(n/10)===7)c.add(n-10);
  return shuffle([...c].filter(x=>x>=0&&x<=max&&x!==n)).slice(0,2);};
function numStep(kind,v){
  if(kind==='numw'||kind==='bigw')return{t:'tr',kind:T('Zahlen'),de:fmt(T('Schreib die Zahl {ON}: '))+v,a:[numEs(+v)]};
  if(kind==='numl'||kind==='bigl'){const n=+v;return{t:'mc',kind:T('Zahlen hören'),q:T('Welche Zahl hörst du?'),say:numEs(n),autoSay:true,opts:[v,...near(n,n<21?20:2100).map(String)],a:0};}
  const[hh,mm]=v.split(':').map(Number);
  if(kind==='time')return{t:'tr',kind:T('Uhrzeit'),de:T('Wie spät ist es? 🕒 ')+v,a:[horaEs(hh,mm).join('|')]};
  if(kind==='timel'){const o=new Set([v]);while(o.size<3){const d=rint(-1,1)*60+rint(-2,2)*15;const t=((hh*60+mm+d)%1440+1440)%1440;o.add(Math.floor(t/60)+':'+String(t%60).padStart(2,'0'));}
    return{t:'mc',kind:T('Uhrzeit hören'),q:T('Wie spät ist es?'),say:horaEs(hh,mm)[0]+'.',autoSay:true,opts:[...o].map(x=>x.replace(/^(\d+):/,(a,b)=>(+b%12||12)+':')),a:0};}
  if(kind==='date'){const[d,mo]=v.split('.').map(Number);return{t:'tr',kind:T('Datum'),de:T('Wie sagt man das Datum? 📅 ')+d+'. '+[T('Januar'),T('Februar'),T('März'),T('April'),T('Mai'),T('Juni'),T('Juli'),T('August'),T('September'),T('Oktober'),T('November'),T('Dezember')][mo-1],
    a:[NUMS.date(d,mo).join('|')]};}
  const[e,c]=v.split(',').map(Number);const say=NUMS.price(e,c);
  const fmtP=(E,C)=>E+','+String(C).padStart(2,'0')+' €';const o=new Set([fmtP(e,c)]);
  for(const[E,C]of shuffle([[e,(c+50)%100],[e+10,c],[Math.max(1,e-10),c],[e,c===0?5:0],[+String(e).split('').reverse().join('')||e+2,c]]))if(o.size<3)o.add(fmtP(E,C));
  return{t:'mc',kind:T('Preise hören'),q:T('Wie viel kostet es?'),say,autoSay:true,opts:[...o],a:0};}

/* Gemischte Wiederholung: Aufgaben der letzten 3 Runden werden gemieden (S.mixSeen), dazu ein paar frisch erzeugte Vokabelaufgaben */
function mixSteps(n){const pool=[],words=[];const seen=new Set(S.mixSeen||[]);
  for(const u of COURSE.units)for(const l of u.lessons||[]){const r=S.lessons[u.id+'.'+l.id];if(!r?.done||l.freq)continue;
  const age=Math.max(1,(Date.now()-new Date(r.date+'T12:00:00'))/864e5);
  lessonWords(l).forEach(w=>words.push([u,w]));
  l.steps.forEach((st,i)=>{if(['mc','gap','tr','conj','order','listen'].includes(st.t)){const ref=u.id+'|'+l.id+'|'+i;pool.push({s:st,ref,unit:u,w:Math.random()*Math.log(1+age)+Math.random()-(seen.has(ref)?5:0)});}});}
  const nv=pool.length?Math.min(Math.round(n/5),words.length):Math.min(n,words.length);
  const ex=pool.sort((a,b)=>b.w-a.w).slice(0,n-nv);
  const voc=shuffle(words).filter(([u,w])=>!seen.has('W|'+u.id+'|'+w[0])).concat(shuffle(words)).slice(0,nv).map(([u,w])=>{const it=vocabItem(u,w,['mc','mcde','tr','listen'][Math.floor(Math.random()*4)]);it.unit=u;return it;});
  const out=shuffle(ex.concat(voc).slice(0,n-Math.min(2,numKinds().length?2:0)).concat(numItems(2)));
  S.mixSeen=out.map(x=>x.ref.startsWith('W|')?x.ref.split('|').slice(0,2).concat(x.ref.split('|').slice(3)).join('|'):x.ref).concat(S.mixSeen||[]).slice(0,3*n);
  return out;}
function vMix(m){const steps=mixSteps(15);
  if(steps.length<5){m.append(h('h1',{},T('Gemischte Wiederholung')),h('div',{class:'card'},T('Schließ zuerst ein paar Lektionen ab – dann mische ich hier Aufgaben aus allen bisherigen Lektionen durcheinander.')));return;}
  play(m,{title:T('Gemischte Wiederholung · 15 Aufgaben aus allen ')+UWS+'',steps,pk:'mix',onBack:()=>goBack('home'),onDone:()=>{S.lastMix=today();save();return null;}});}

const codeUrl=()=>SRV()+'/api/sync/'+encodeURIComponent(S.settings.syncCode)+'/'+encodeURIComponent(GIST_FILE);
function syncLabel(){const st=S.settings;if(!syncOn())return T('Fortschritt nur auf diesem Gerät');
  if(syncState.status==='busy')return T('☁️ synchronisiere…');if(syncState.status==='error')return T('⚠️ Sync-Fehler (offline?)');
  return syncState.at?T('☁️ synchronisiert ')+new Date(syncState.at).toLocaleTimeString(T('de-DE'),{hour:'2-digit',minute:'2-digit'}):T('☁️ Sync aktiv');}
function setSync(st){syncState.status=st;if(st==='ok')syncState.at=Date.now();const e=document.getElementById('syncstat');if(e)e.textContent=syncLabel();}
function payload(){const d=JSON.parse(JSON.stringify(S));delete d.settings;return d;}
function mergeState(a,b){ // a=lokal, b=remote → vereinigt, nichts geht verloren
  const o=JSON.parse(JSON.stringify(a));
  o.lessons=Object.assign({},b.lessons||{});for(const[k,v]of Object.entries(a.lessons||{})){const r=o.lessons[k];
    o.lessons[k]=r?{done:!!(v.done||r.done),best:Math.max(v.best||0,r.best||0),date:(v.date||'')>(r.date||'')?v.date:r.date,r:Math.max(legacyR(v),legacyR(r)),d2:(v.d2||'')>(r.d2||'')?v.d2:r.d2,check:!!(v.check||r.check)}:v;}
  o.srs=Object.assign({},b.srs||{});for(const[k,v]of Object.entries(a.srs||{})){const r=o.srs[k];
    if(!r)o.srs[k]=v;else if((v.t||0)>(r.t||0)||(!v.t&&!r.t&&(v.box||0)>(r.box||0)))o.srs[k]=v;}
  const pa=a.placement,pb=b.placement;o.placement=!pa?pb||null:!pb?pa:((pa.ts||0)>=(pb.ts||0)?pa:pb);
  const sa=a.stats||{},sb=b.stats||{};o.stats={answers:Math.max(sa.answers||0,sb.answers||0),correct:Math.max(sa.correct||0,sb.correct||0),days:Object.assign({},sb.days||{})};
  for(const[d,n]of Object.entries(sa.days||{}))o.stats.days[d]=Math.max(n,o.stats.days[d]||0);
  const ta=a.streak||{},tb=b.streak||{};o.streak=(ta.last||'')>(tb.last||'')?ta:(tb.last||'')>(ta.last||'')?tb:((ta.count||0)>=(tb.count||0)?ta:tb);
  o.mistakes=((a.updated||0)>=(b.updated||0)?a.mistakes:b.mistakes)||[];
  o.lastMix=(a.lastMix||'')>(b.lastMix||'')?a.lastMix:b.lastMix;
  if((b.vocabGoalT||0)>(a.vocabGoalT||0)){o.vocabGoal=b.vocabGoal;o.vocabGoalT=b.vocabGoalT;}
  if((b.planT||0)>(a.planT||0)){o.plan=b.plan;o.planT=b.planT;}
  o.mylists=Object.assign({},b.mylists||{});for(const[k,v]of Object.entries(a.mylists||{})){const r=o.mylists[k];if(!r||(v.t||0)>=(r.t||0))o.mylists[k]=v;}
  o.vlog=Object.assign({},b.vlog||{});for(const[k,v]of Object.entries(a.vlog||{}))o.vlog[k]=Math.max(v,o.vlog[k]||0);
  o.day=Object.assign({},b.day||{});for(const[k,v]of Object.entries(a.day||{}))if(v>(o.day[k]||''))o.day[k]=v;
  o.shadow=Object.assign({},b.shadow||{},a.shadow||{});
  /* Profil (Name, Nachname, Ansprache, Herkunft): neueste Änderung gewinnt (profT), sonst wie bisher lokal zuerst */
  {const P=(b.profT||0)>(a.profT||0)?[b,a]:[a,b];o.name=P[0].name||P[1].name;o.gender=P[0].gender||P[1].gender;o.origin=P[0].origin||P[1].origin;o.surname=P[0].profT?P[0].surname:(P[0].surname||P[1].surname);if(!o.surname)delete o.surname;o.profT=Math.max(a.profT||0,b.profT||0)||undefined;}
  o.readings=Object.assign({},b.readings||{});for(const[k,v]of Object.entries(a.readings||{})){const r=o.readings[k];o.readings[k]=!r?v:{date:v.date>r.date?v.date:r.date,score:Math.max(v.score||0,r.score||0)};}
  o.stories=Object.assign({},b.stories||{});for(const[k,v]of Object.entries(a.stories||{})){const r=o.stories[k];o.stories[k]=!r?v:{date:v.date>r.date?v.date:r.date,score:Math.max(v.score||0,r.score||0)};}
  o.checks=Object.assign({},b.checks||{});for(const[k,v]of Object.entries(a.checks||{})){const r=o.checks[k];o.checks[k]=!r?v:{date:(v.date>r.date?v.date:r.date),score:Math.max(v.score||0,r.score||0),pass:!!(v.pass||r.pass)};}
  o.updated=Math.max(a.updated||0,b.updated||0);return o;}
async function gh(path,opt={}){const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','Authorization':'Bearer '+S.settings.ghToken},opt.body?{'Content-Type':'application/json'}:{})}));
  if(r.status===401)throw new Error(T('Zugangsschlüssel ungültig oder abgelaufen.'));if(!r.ok)throw new Error(T('GitHub-Fehler ')+r.status);return r.status===204?null:r.json();}
async function findOrCreateGist(){
  for(let page=1;page<=5;page++){const list=await gh('/gists?per_page=100&page='+page);const g=list.find(x=>x.files&&Object.keys(x.files).some(f=>f.startsWith('mi-profe-fortschritt')));if(g)return g.id;if(list.length<100)break;}
  const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});return g.id;}
async function syncNow(opts={}){const st=S.settings;if(!syncOn()||syncBusy)return false;syncBusy=true;setSync('busy');
  try{let remote={};
    if(useCode()){/* Sync-Code: Fortschritt dieser Lernsprache vom Mi-profe-Server */const r=await fetch(codeUrl(),{cache:'no-store'});
      if(r.status===404)throw new Error(T('Sync-Code unbekannt – bitte prüfen.'));if(!r.ok)throw new Error(T('Server-Fehler ')+r.status);remote=await r.json().catch(()=>({}));}
    else{if(!st.gistId){st.gistId=await findOrCreateGist();save(true);}
    const g=await gh('/gists/'+st.gistId);const f=g.files&&g.files[GIST_FILE];
    if(f){let txt=f.content;if(f.truncated&&f.raw_url)txt=await (await fetch(f.raw_url)).text();try{remote=JSON.parse(txt||'{}');}catch(e){remote={};}}}
    const before=JSON.stringify(payload());const settings=S.settings;
    const merged=mergeState(payload(),remote);S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),merged);S.settings=settings;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    const after=JSON.stringify(payload());
    if(after!==JSON.stringify(remote)){if(useCode()){const r=await fetch(codeUrl(),{method:'PUT',headers:{'Content-Type':'application/json'},body:after});if(!r.ok)throw new Error(T('Server-Fehler ')+r.status);}
      else await gh('/gists/'+st.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content:after}}})});}
    setSync('ok');
    if(before!==after&&!opts.quiet){const r=curRoute().split('/')[0];if(['home','units','unit','vocab','mistakes','placement','settings','words','resumen'].includes(r))route();}
    return true;}
  catch(e){setSync('error');console.warn(T('Sync'),e);if(opts.throw)throw e;return false;}
  finally{syncBusy=false;}}
/* Abgleich nach dem Lernen: GitHub nach 4 s Ruhe, Server-Code nach 30 s (schont den kostenlosen Speicher), immer beim Verlassen der App */
window.__sync={schedule(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow({quiet:true}),useCode()?30000:4000);}};
window.addEventListener('focus',()=>{if(syncOn())syncNow();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&syncOn()){clearTimeout(syncTimer);syncNow({quiet:true});}});

window.__app={S:()=>S,compare,route,mergeState,RENDER,resolveRef,numEs,horaEs,numItems};
/* App-Gefühl: kein Pinch-/Doppeltipp-Zoom */
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
/* Einladungs- und Verbinden-Links: ?einladung=CODE schaltet den Server frei, ?sync=CODE verbindet dieses Gerät */
{const q=new URLSearchParams(location.search);const inv=q.get('einladung'),sc=q.get('sync');
  if(inv||sc){if(inv)S.settings.invite=inv.trim().toUpperCase();if(sc)S.settings.syncCode=sc.trim().toUpperCase();save(true);
    try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}setTimeout(()=>toast(sc?T('Gerät wird verbunden …'):T('Einladung gespeichert ✓')),800);}}
setTimeout(()=>{if(syncOn())syncNow();},300);
/* Service Worker: App kommt sofort aus dem Speicher; Updates im Hintergrund prüfen (beim Start und beim Zurückkehren in die App).
   Hat eine neue Version übernommen → Hinweis zum Neuladen (nicht automatisch, damit keine Lektion abbricht). */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&window.PWA){const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r=>{const chk=()=>r.update().catch(()=>{});setTimeout(chk,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});}).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||document.getElementById('updbar'))return;
    document.body.append(h('button',{id:'updbar',class:'updbar',onclick:()=>reloadApp()},T('✨ Neue Version – tippen zum Laden')));});}
route();
})();
</script>
