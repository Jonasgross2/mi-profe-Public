# Cloudflare Worker für Mi profe (Sync per Code + KI für Freunde & Familie). Anleitung: server/README.md
name = "mi-profe"
main = "worker.js"
compatibility_date = "2026-10-01"

# KV-Speicher: id kommt aus `npx wrangler kv namespace create DATA` (Ausgabe hier eintragen)
[[kv_namespaces]]
binding = "DATA"
id = "8390c2a45fa14862859302b13fec989d"

[vars]
AI_LIMIT = "60"
# GEMINI_KEY und INVITES sind Geheimnisse: `npx wrangler secret put GEMINI_KEY` bzw. `… INVITES` – nie hier eintragen
